# SonarQube Configuration for Ticket Architecture Benchmark
sonar.projectKey=ticket-architecture-benchmark
sonar.projectName=Ticket Architecture Benchmark (Monolith vs. Microservices)
sonar.projectVersion=1.0.0

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.sources=monolith/src,microservices/services,shared/src
sonar.tests=tests

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/specs/**,**/*.sql,**/*.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript Specifics
sonar.typescript.tsconfigPath=tsconfig.json

