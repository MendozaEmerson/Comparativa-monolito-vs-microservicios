version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: benchmark_ms_postgres
    environment:
      POSTGRES_USER: benchmark_user
      POSTGRES_PASSWORD: benchmark_pass
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - ./benchmark/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./benchmark/scripts/seed-database.sql:/docker-entrypoint-initdb.d/02-seed.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark_user -d ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  events-service:
    build:
      context: .
      dockerfile: microservices/services/events-service/Dockerfile
    container_name: benchmark_ms_events
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: benchmark_user
      DB_PASSWORD: benchmark_pass
      DB_NAME: ticket_db
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 832M

  reservations-service:
    build:
      context: .
      dockerfile: microservices/services/reservations-service/Dockerfile
    container_name: benchmark_ms_reservations
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: benchmark_user
      DB_PASSWORD: benchmark_pass
      DB_NAME: ticket_db
      EVENTS_SERVICE_URL: http://events-service:3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      events-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 832M

  api-gateway:
    build:
      context: .
      dockerfile: microservices/services/api-gateway/Dockerfile
    container_name: benchmark_ms_gateway
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      EVENTS_SERVICE_URL: http://events-service:3001
      RESERVATIONS_SERVICE_URL: http://reservations-service:3002
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      events-service:
        condition: service_started
      reservations-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

